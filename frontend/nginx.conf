server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка фото питомцев/аватаров
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
    gzip_min_length 1024;

    # --- backend (FastAPI) ---
    location ~ ^/(api|uploads|admin|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- кэш для хэшированных файлов Vite и 3D-моделей ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- React SPA: любые маршруты отдают index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
