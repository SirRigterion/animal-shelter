# Приют «Лапа Помощи»: PostgreSQL + FastAPI + React (nginx).
# Запуск:  cp .env.example .env  →  отредактировать  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animal_shelter}
      POSTGRES_USER: ${POSTGRES_USER:-shelter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shelter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-animal_shelter}
      JWT_SECRET: ${JWT_SECRET:?Укажите JWT_SECRET в .env}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shelter.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
